.menu-head .menu-id strong { display: block; font: var(--typography-label); font-family: var(--font-family-sans); color: var(--color-role-fg); }
.menu-head .menu-id span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--size-hit); padding: 0 var(--space-3); border-radius: var(--radius-md); font: var(--typography-body); font-family: var(--font-family-sans); color: var(--color-role-fg); text-align: left; }
.menu-item .icon { color: var(--color-role-fg-muted); }
.menu-item:hover { background: var(--color-role-surface-muted); }
.menu-item.is-danger { color: var(--color-role-danger); }
.menu-item.is-danger .icon { color: inherit; }
.menu-item.is-danger:hover { background: var(--color-role-danger-soft); }
.menu-sep { height: var(--border-width-hairline); background: var(--color-role-border); margin: var(--space-2) 0; }
.popover-fixed { position: fixed; top: 0; left: 0; right: auto; width: var(--hifi-menu-w); }
.scrim { position: fixed; inset: 0; background: var(--color-role-overlay); z-index: calc(var(--hifi-z-sidebar) - 1); display: none; }
html[data-drawer="open"] .scrim, html[data-convs="open"] .scrim, html[data-dialog="open"] .scrim { display: block; }
html[data-dialog="open"] .scrim { z-index: calc(var(--hifi-z-popover) - 1); }

/* ---------- 内容区：会话列表 + 消息流 + 输入区 ---------- */
.content { flex: 1; min-height: 0; display: flex; width: 100%; }

.convs {
  flex: none; width: var(--size-conversation-list); display: flex; flex-direction: column; min-height: 0;
  background: var(--color-role-surface); border-right: var(--border-width-hairline) solid var(--color-role-border);
}
.convs-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-3) var(--space-3) var(--space-2) var(--space-4); flex: none; }
.convs-head h1 { font: var(--typography-title); font-family: var(--font-family-sans); }
.convs-head .head-actions { display: flex; align-items: center; gap: var(--space-1); }
.convs-search { margin: 0 var(--space-3) var(--space-2); width: auto; height: var(--size-hit); }
.convs-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-2) var(--space-4); }
.grp-label { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-3) var(--space-2) var(--space-1); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); font-weight: var(--font-weight-medium); }
.grp-label .num { font-weight: var(--font-weight-regular); }
.grp ul { display: flex; flex-direction: column; gap: var(--space-1); }
.citem { position: relative; }
.citem-link {
  display: flex; flex-direction: column; gap: var(--space-1); width: 100%; min-height: var(--size-control-lg); text-align: left;
  padding: var(--space-2) var(--size-hit) var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--color-role-fg);
  transition: background-color var(--motion-fast) var(--motion-ease);
}
.citem-link:hover { background: var(--color-role-surface-muted); }
.citem-link[aria-current="page"] { background: var(--color-role-primary-soft); color: var(--color-role-on-primary-soft); }
.citem-link[aria-current="page"] .citem-meta { color: var(--color-role-on-primary-soft); }
.citem-title { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font: var(--typography-label); font-family: var(--font-family-sans); }
.citem-title > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem-dot { flex: none; width: var(--size-dot); height: var(--size-dot); border-radius: var(--radius-full); background: var(--color-role-primary); }
.citem-meta { font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citem[data-unread="true"] .citem-title { font-weight: var(--font-weight-semibold); }
.citem-more { position: absolute; right: var(--space-1); top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity var(--motion-fast) var(--motion-ease); }
.citem:hover .citem-more, .citem:focus-within .citem-more, .citem-more[aria-expanded="true"] { opacity: 1; }
.convs-empty { padding: var(--space-8) var(--space-4); text-align: center; color: var(--color-role-fg-muted); }
.convs-sk { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) var(--space-2); }
.convs-sk .sk-item { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-2) var(--space-3); }

.convs-new-mobile { display: none; }
.thread-col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.thread-head { display: none; }
.thread { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-6) var(--space-6) var(--space-4); scroll-behavior: smooth; }
.thread-inner { max-width: var(--size-thread-max); width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-6); }
.datesep { display: flex; align-items: center; gap: var(--space-3); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); }
.datesep::before, .datesep::after { content: ""; flex: 1; border-top: var(--border-width-hairline) solid var(--color-role-border); }

.msg { display: grid; grid-template-columns: var(--size-avatar-md) minmax(0, 1fr); gap: var(--space-3); align-items: start; }
.msg .col { min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.msg.me { grid-template-columns: minmax(0, 1fr) var(--size-avatar-md); }
.msg.me .col { grid-column: 1; align-items: flex-end; }
.msg.me .avatar { grid-column: 2; grid-row: 1; }
.who { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-avatar-md); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); }
.who .name { font: var(--typography-label); font-family: var(--font-family-sans); color: var(--color-role-fg); }
.bubble {
  background: var(--color-role-surface); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5); box-shadow: var(--shadow-sm); min-width: 0; max-width: 100%;
}
.msg.me .bubble { background: var(--color-role-primary-soft); border-color: transparent; box-shadow: none; color: var(--color-role-fg); max-width: var(--size-bubble-max); overflow-wrap: anywhere; }
.msg.me .actions { justify-content: flex-end; }
.actions { display: flex; align-items: center; gap: 0; margin: calc(-1 * var(--space-1)) 0 0 calc(-1 * var(--space-2)); }
.msg.me .actions { margin: calc(-1 * var(--space-1)) calc(-1 * var(--space-2)) 0 0; }
.actions .iconbtn { color: var(--color-role-fg-muted); }
.actions .iconbtn[aria-pressed="true"] { color: var(--color-role-primary); }

/* Markdown */
.md { display: flex; flex-direction: column; gap: var(--space-3); font: var(--typography-body); font-family: var(--font-family-sans); color: var(--color-role-fg); }
.md p { overflow-wrap: anywhere; }
.md strong { font-weight: var(--font-weight-semibold); }
.md ul { list-style: disc; padding-left: var(--space-5); display: flex; flex-direction: column; gap: var(--space-1); }
.md blockquote { border-left: var(--border-width-accent) solid var(--color-role-primary); padding: var(--space-1) 0 var(--space-1) var(--space-4); color: var(--color-role-fg-muted); }
.md .ref-id { font-family: var(--font-family-mono); font-size: var(--font-size-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
.md-table { position: relative; overflow-x: auto; margin: 0; --hifi-scroll-shadow: var(--space-6); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-md); }
.md-table.is-scrollable {
  background:
    linear-gradient(90deg, var(--color-role-surface) 50%, transparent) left / var(--hifi-scroll-shadow) 100% no-repeat local,
    linear-gradient(270deg, var(--color-role-surface) 50%, transparent) right / var(--hifi-scroll-shadow) 100% no-repeat local,
    linear-gradient(90deg, var(--hifi-scroll-shadow-color), transparent) left / var(--hifi-scroll-shadow) 100% no-repeat scroll,
    linear-gradient(270deg, var(--hifi-scroll-shadow-color), transparent) right / var(--hifi-scroll-shadow) 100% no-repeat scroll;
}
.md-table table { width: 100%; border-collapse: collapse; }
.md-table th { text-align: left; font: var(--typography-caption); font-family: var(--font-family-sans); font-weight: var(--font-weight-medium); color: var(--color-role-fg-muted); padding: var(--space-2) var(--space-3); background: var(--color-role-surface-muted); border-bottom: var(--border-width-hairline) solid var(--color-role-border); white-space: nowrap; height: var(--size-table-header); }
.md-table td { padding: var(--space-2) var(--space-3); border-bottom: var(--border-width-hairline) solid var(--color-role-border); vertical-align: middle; white-space: nowrap; height: var(--size-table-row-compact); }
.md-table tbody tr:last-child td { border-bottom: 0; }
.md-table tbody tr:hover td { background: var(--color-role-bg); }
.md-table .al-right { text-align: right; font-variant-numeric: tabular-nums; }
.md-table td.mono { font-family: var(--font-family-mono); font-size: var(--font-size-sm); }
.table-hint { display: none; margin-top: calc(-1 * var(--space-1)); }
.table-hint.is-visible { display: block; }
.code { border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-md); background: var(--color-role-surface-muted); overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-3); min-height: var(--size-hit); border-bottom: var(--border-width-hairline) solid var(--color-role-border); }
.code-lang { font: var(--typography-caption); font-family: var(--font-family-mono); color: var(--color-role-fg-muted); text-transform: uppercase; }
.code pre { margin: 0; padding: var(--space-3) var(--space-4); overflow-x: auto; font: var(--typography-code); letter-spacing: var(--typography-code-letter-spacing); font-family: var(--font-family-mono); color: var(--color-role-fg); }
.code pre code { font: inherit; }
.code-copy .lbl { display: none; }
.code-copy[aria-pressed="true"] { color: var(--color-role-success); }

/* 工具调用折叠卡 */
.tools { display: flex; flex-direction: column; gap: var(--space-2); }
.tool { border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-md); background: var(--color-role-surface); }
.tool summary { list-style: none; display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-hit); padding: 0 var(--space-2) 0 var(--space-3); border-radius: var(--radius-md); cursor: pointer; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary:hover { background: var(--color-role-surface-muted); }
.tool[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: var(--border-width-hairline) solid var(--color-role-border); }
.tool-status { display: inline-flex; width: var(--size-icon-md); height: var(--size-icon-md); flex: none; align-items: center; justify-content: center; }
.tool-status .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.tool[data-status="done"] .tool-status { color: var(--color-role-success); }
.tool[data-status="running"] .tool-status { color: var(--color-role-primary); }
.tool[data-status="running"] .tool-status .icon { animation: spin var(--motion-blink) linear infinite; }
.tool[data-status="failed"] .tool-status { color: var(--color-role-danger); }
@keyframes spin { to { transform: rotate(360deg); } }
.tool-name { font: var(--typography-label); font-family: var(--font-family-sans); color: var(--color-role-fg); white-space: nowrap; }
.tool-brief { flex: 1; min-width: 0; font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-chev { color: var(--color-role-fg-muted); transition: transform var(--motion-fast) var(--motion-ease); }
.tool[open] .tool-chev { transform: rotate(180deg); }
.tool dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--space-4); }
.tool dt { font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); padding-top: var(--space-1); }
.tool dd { font: var(--typography-body); font-family: var(--font-family-sans); overflow-wrap: anywhere; }
.tool dd.mono { font-family: var(--font-family-mono); font-size: var(--font-size-sm); }

/* 来源 Chip / 建议 Chip：元素热区 40，视觉胶囊 32 */
.chip { display: inline-flex; align-items: center; min-height: var(--size-hit); padding: var(--space-1) 0; border-radius: var(--radius-full); color: var(--color-role-fg); max-width: 100%; }
.chip-body {
  display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-control-sm); padding: 0 var(--space-3); max-width: 100%;
  border-radius: var(--radius-full); background: var(--color-role-surface); border: var(--border-width-hairline) solid var(--color-role-border);
  font: var(--typography-label); font-family: var(--font-family-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background-color var(--motion-fast) var(--motion-ease), border-color var(--motion-fast) var(--motion-ease);
}
.chip-body .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); color: var(--color-role-fg-muted); }
.chip-body > span { overflow: hidden; text-overflow: ellipsis; }
.chip:hover .chip-body { background: var(--color-role-surface-muted); border-color: var(--color-role-border-strong); }
.chip:focus-visible { outline: none; }
.chip:focus-visible .chip-body { outline: var(--border-width-focus) solid var(--color-role-focus-ring); outline-offset: var(--border-focus-offset); }
.chip.is-order .chip-body { font-family: var(--font-family-mono); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
.chip.is-suggest .chip-body .icon { color: var(--color-role-primary); }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--space-2); margin-top: var(--space-1); }
.sources .lbl { font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); margin-right: var(--space-1); }

/* 流式态 */
.msg[aria-busy="true"] .bubble { border-color: var(--color-role-primary-soft); }
.cursor { display: inline-block; width: var(--border-width-focus); height: var(--font-size-sm); margin-left: var(--space-1); vertical-align: text-bottom; background: var(--color-role-primary); border-radius: var(--border-width-hairline); animation: blink var(--motion-blink) steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* 错误 Alert */
.alert {
  display: grid; grid-template-columns: var(--size-icon-md) minmax(0, 1fr); gap: var(--space-2) var(--space-3); align-items: start;
  padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); border: var(--border-width-hairline) solid var(--color-role-danger);
  background: var(--color-role-danger-soft); color: var(--color-role-fg);
}
.alert .icon { color: var(--color-role-danger); margin-top: var(--space-1); }
.alert strong { display: block; font: var(--typography-label); font-family: var(--font-family-sans); color: var(--color-role-danger); margin-bottom: var(--space-1); }
.alert .alert-actions { grid-column: 2; display: flex; gap: var(--space-2); flex-wrap: wrap; margin-left: calc(-1 * var(--space-3)); }
.alert .btn-ghost { color: var(--color-role-fg-muted); }
.alert .btn-ghost:hover { background: transparent; color: var(--color-role-fg); }
.alert .btn-secondary { margin-left: var(--space-3); }

/* 骨架屏 */
.sk { position: relative; overflow: hidden; background: var(--color-role-skeleton); border-radius: var(--radius-sm); }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); opacity: var(--opacity-skeleton-shine); background: linear-gradient(90deg, transparent, var(--color-role-surface), transparent); animation: shine var(--motion-skeleton) var(--motion-ease) infinite; }
@keyframes shine { to { transform: translateX(100%); } }
.sk-text { height: var(--space-3); }
.sk-label { height: var(--space-4); }
.sk-circle { border-radius: var(--radius-full); width: var(--size-avatar-md); height: var(--size-avatar-md); flex: none; }
.sk-w-1 { width: 25%; } .sk-w-2 { width: 40%; } .sk-w-3 { width: 60%; } .sk-w-4 { width: 80%; } .sk-w-full { width: 100%; }
.sk-bubble { border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4) var(--space-5); border: var(--border-width-hairline) solid var(--color-role-border); background: var(--color-role-surface); }
.sk-bubble .sk { height: var(--space-3); }
.sk-msg { display: grid; grid-template-columns: var(--size-avatar-md) minmax(0, 1fr); gap: var(--space-3); }
.sk-msg.me { grid-template-columns: minmax(0, 1fr) var(--size-avatar-md); }
.sk-msg.me .sk-bubble { grid-column: 1; width: 45%; justify-self: end; background: var(--color-role-skeleton); border-color: transparent; }
.sk-msg.me .sk-circle { grid-column: 2; grid-row: 1; }
.sk-msg .sk-bubble { width: 85%; }

/* 欢迎（empty）/ 历史不可用 */
.welcome { max-width: var(--size-thread-max); margin: auto; width: 100%; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-8) 0; }
.welcome-mark { width: var(--hifi-welcome-mark); height: var(--hifi-welcome-mark); border-radius: var(--radius-lg); background: var(--color-role-primary); color: var(--color-role-on-primary); display: grid; place-items: center; margin-bottom: var(--space-4); }
.welcome-mark svg { width: var(--size-icon-lg); height: var(--size-icon-lg); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.welcome h2 { font: var(--typography-display); letter-spacing: var(--typography-display-letter-spacing); font-family: var(--font-family-sans); }
.welcome > p { color: var(--color-role-fg-muted); font: var(--typography-lead); font-family: var(--font-family-sans); max-width: var(--size-prose-max); }
.welcome .sugg-title { margin-top: var(--space-6); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); font-weight: var(--font-weight-medium); }
.sugg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-2); }
.sugg-card {
  display: flex; align-items: center; gap: var(--space-3); text-align: left; min-height: var(--size-control-lg); padding: var(--space-4);
  background: var(--color-role-surface); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-lg); color: var(--color-role-fg);
  font: var(--typography-body); font-family: var(--font-family-sans);
  transition: border-color var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-ease), background-color var(--motion-fast) var(--motion-ease);
}
.sugg-card:hover { border-color: var(--color-role-border-strong); box-shadow: var(--shadow-sm); background: var(--color-role-surface-raised); }
.sugg-card .sugg-icon { width: var(--size-avatar-md); height: var(--size-avatar-md); flex: none; border-radius: var(--radius-md); background: var(--color-role-primary-soft); color: var(--color-role-on-primary-soft); display: grid; place-items: center; }
.sugg-card .sugg-icon .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.sugg-card span:last-child { min-width: 0; overflow-wrap: anywhere; }
.state-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-16) var(--space-6); gap: var(--space-2); margin: auto; max-width: var(--size-thread-max); width: 100%; background: var(--color-role-surface); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.state-card .figure { width: var(--size-control-lg); height: var(--size-control-lg); border-radius: var(--radius-full); display: grid; place-items: center; background: var(--color-role-neutral-soft); color: var(--color-role-on-neutral-soft); margin-bottom: var(--space-4); }
.state-card h2 { font: var(--typography-heading); font-family: var(--font-family-sans); }
.state-card p { color: var(--color-role-fg-muted); max-width: calc(var(--size-form-max) + var(--size-sidebar-rail)); }
.state-card .actions { margin: var(--space-4) 0 0; gap: var(--space-3); }

.disclaimer { text-align: center; font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); }
.tobottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--space-4); z-index: 1; box-shadow: var(--shadow-md); }
.tobottom[hidden] { display: none; }

/* 视图切换 */
.view { display: none; }
html[data-view="thread"] .view-thread, html[data-view="empty"] .view-empty, html[data-view="loading"] .view-loading, html[data-view="unavailable"] .view-unavailable { display: flex; }
.view-thread { flex-direction: column; gap: var(--space-6); }
.view-loading { flex-direction: column; gap: var(--space-6); max-width: var(--size-thread-max); margin: 0 auto; width: 100%; }
html[data-view="empty"] .thread, html[data-view="unavailable"] .thread { display: flex; }
html[data-state="loading"] .convs-list { display: none; }
html:not([data-state="loading"]) .convs-sk { display: none; }

/* ---------- 输入区 ---------- */
.composer { flex: none; padding: var(--space-2) var(--space-6) var(--space-4); background: var(--color-role-bg); }
.composer-inner { max-width: var(--size-thread-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-2); }
.chips-row { display: flex; flex-wrap: wrap; gap: 0 var(--space-2); }
html[data-view="empty"] .chips-row, html[data-view="loading"] .chips-row, html[data-view="unavailable"] .chips-row { display: none; }
.box {
  background: var(--color-role-surface); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1);
  transition: border-color var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-ease);
}
.box:focus-within { border-color: var(--color-role-primary); box-shadow: 0 0 0 var(--border-width-focus) var(--color-role-primary-soft); }
.att-row { display: flex; flex-wrap: wrap; gap: var(--space-2); padding-top: var(--space-2); }
.att-row[hidden] { display: none; }
.att-chip { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-hit); padding: 0 0 0 var(--space-3); border-radius: var(--radius-full); background: var(--color-role-surface-muted); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg); max-width: 100%; }
.att-chip .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); color: var(--color-role-fg-muted); }
.att-chip .att-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-chip .att-size { color: var(--color-role-fg-muted); white-space: nowrap; }
.att-chip .iconbtn { border-radius: var(--radius-full); }
textarea.input {
  width: 100%; border: 0; background: transparent; resize: none; display: block;
  font: var(--typography-body); font-family: var(--font-family-sans); color: var(--color-role-fg);
  padding: calc((var(--size-hit) - var(--hifi-textarea-line)) / 2) 0; min-height: var(--size-hit); max-height: calc(var(--hifi-textarea-line) * 8 + var(--space-4)); overflow-y: auto;
}
textarea.input::placeholder { color: var(--color-role-fg-muted); }
textarea.input:focus-visible { outline: none; }
.box-row { display: flex; align-items: center; gap: var(--space-1); margin-left: calc(-1 * var(--space-2)); }
.model-btn { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--size-hit); padding: 0 var(--space-2) 0 var(--space-3); border-radius: var(--radius-md); font: var(--typography-label); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); }
.model-btn:hover, .model-btn[aria-expanded="true"] { background: var(--color-role-surface-muted); color: var(--color-role-fg); }
.model-btn .icon-sm { color: var(--color-role-primary); }
.model-btn .chev { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.model-pop { top: auto; bottom: calc(100% + var(--space-2)); right: auto; left: 0; width: calc(var(--hifi-popover-w) * 0.8); }
.model-pop [role="option"] { display: grid; grid-template-columns: minmax(0, 1fr) var(--size-icon-md); gap: var(--space-3); align-items: center; width: 100%; min-height: var(--size-hit); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); text-align: left; }
.model-pop [role="option"]:hover { background: var(--color-role-surface-muted); }
.model-pop [role="option"] strong { display: block; font: var(--typography-label); font-family: var(--font-family-sans); }
.model-pop [role="option"] .icon { color: var(--color-role-primary); visibility: hidden; }
.model-pop [role="option"][aria-selected="true"] .icon { visibility: visible; }
.counter { margin-left: auto; font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 var(--space-2); display: none; }
.counter.is-visible { display: block; }
.counter.is-over { color: var(--color-role-danger); }
.box-row .spacer { flex: 1; }
.counter.is-visible + .spacer { display: none; }
.send { background: var(--color-role-primary); color: var(--color-role-on-primary); }
.send:hover { background: var(--color-role-primary-hover); color: var(--color-role-on-primary); }
.send:disabled { background: var(--color-role-primary); }
.stop { background: var(--color-role-bg-inverse); color: var(--color-role-fg-inverse); display: none; }
.stop:hover { background: var(--color-role-fg-muted); color: var(--color-role-fg-inverse); }
html[data-state="streaming"] .send { display: none; }
html[data-state="streaming"] .stop { display: inline-flex; }
.hint { display: flex; justify-content: space-between; gap: var(--space-3); padding: 0 var(--space-1); font: var(--typography-caption); font-family: var(--font-family-sans); color: var(--color-role-fg-muted); }
.hint .att-err { color: var(--color-role-danger); }
.hint .att-err[hidden] { display: none; }

/* ---------- Toast / Dialog ---------- */
.toast {
  position: fixed; top: calc(var(--size-topbar) + var(--space-4)); right: var(--space-6); z-index: var(--hifi-z-toast);
  display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  background: var(--color-role-surface-raised); color: var(--color-role-fg); border: var(--border-width-hairline) solid var(--color-role-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); font: var(--typography-label); font-family: var(--font-family-sans);
  animation: toast-in var(--motion-base) var(--motion-ease);
}
.toast[hidden] { display: none; }
.toast .icon { color: var(--color-role-success); }
@keyframes toast-in { from { opacity: 0; transform: translateY(calc(-1 * var(--space-2))); } }
.dialog {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--size-dialog); max-width: calc(100vw - var(--space-8)); z-index: var(--hifi-z-popover);
  background: var(--color-role-surface-raised); border: var(--border-width-hairline) solid var(--color-role-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3);
}
.dialog[hidden] { display: none; }
.dialog h2 { font: var(--typography-title); font-family: var(--font-family-sans); overflow-wrap: anywhere; }
.dialog p { color: var(--color-role-fg-muted); }
.dialog .actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-3); }

/* ---------- 响应式：≤1024 图标栏默认 ---------- */
@media (max-width: 1024px) {
  .search { width: var(--size-sidebar-expanded); }
}

/* ---------- 响应式：≤768 主导航抽屉 + 会话列表 Sheet + 整页滚动 ---------- */
@media (max-width: 768px) {
  .only-mobile { display: inline-flex; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: var(--size-sidebar-drawer);
    transform: translateX(-100%); box-shadow: none; visibility: hidden;
    transition: transform var(--motion-base) var(--motion-ease), visibility 0s linear var(--motion-base);
  }
  html[data-sidebar="rail"] .sidebar { width: var(--size-sidebar-drawer); }
  html[data-sidebar="rail"] .brand-text, html[data-sidebar="rail"] .nav-label, html[data-sidebar="rail"] .nav-item .count-badge, html[data-sidebar="rail"] .nav-group-label { display: revert; }
  html[data-sidebar="rail"] .nav-label { display: block; }
  html[data-sidebar="rail"] .nav-item { justify-content: flex-start; padding: 0 var(--space-3); width: auto; }
  html[data-sidebar="rail"] .nav-item[data-badge]::before { display: none; }
  html[data-sidebar="rail"] .nav-item[data-tip-rail]::after { content: attr(data-tip); }
  html[data-sidebar="rail"] .nav-item[data-tip-rail]:not([data-tip])::after { display: none; }
  html[data-sidebar="rail"] .nav-group { border-top: 0; padding-top: 0; }
  html[data-drawer="open"] .sidebar { transform: none; box-shadow: var(--shadow-lg); visibility: visible; transition-delay: 0s; }
  .brand .iconbtn { display: inline-flex; }
  .sidebar-foot { display: none; }
  .frame { height: auto; min-height: 100vh; }
  .topbar { padding: 0 var(--space-4); gap: var(--space-2); }
  .crumbs .crumb-root, .crumbs .crumb-sep { display: none; }
  .crumbs [aria-current="page"] { font: var(--typography-title); font-family: var(--font-family-sans); }
  .topbar .search { display: none; }
  .topbar-right { gap: 0; }
  .popover { position: fixed; top: calc(var(--size-topbar) + var(--space-2)); left: var(--space-4); right: var(--space-4); width: auto; }
  .content { flex-direction: column; min-height: 0; }
  /* 会话列表 → 左侧 Sheet（关闭时离屏 + visibility:hidden + inert） */
  .convs {
    position: fixed; top: 0; left: 0; height: 100vh; width: var(--size-sheet); max-width: calc(100vw - var(--space-12)); z-index: var(--hifi-z-sidebar);
    transform: translateX(-100%); visibility: hidden; border-right: 0;
    transition: transform var(--motion-base) var(--motion-ease), visibility 0s linear var(--motion-base);
  }
  html[data-convs="open"] .convs { transform: none; box-shadow: var(--shadow-lg); visibility: visible; transition-delay: 0s; }
  .convs-head { min-height: var(--size-topbar); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); }
  .convs-head .head-actions .btn { display: none; }
  .convs-new-mobile { display: block; padding: 0 var(--space-3) var(--space-2); }
  .thread-col { min-height: 0; }
  .thread-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4) 0; }
  .thread-head .btn { padding: 0 var(--space-3); }
  .thread-head .cur { min-width: 0; flex: 1; font: var(--typography-label); font-family: var(--font-family-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-role-fg-muted); }
  .thread { flex: none; overflow: visible; padding: var(--space-4); }
  .thread-inner { gap: var(--space-5); }
  .who .name { display: none; }
  .bubble { padding: var(--space-3) var(--space-4); }
  .msg.me .bubble { max-width: 100%; }
  .md-table { --hifi-scroll-shadow: var(--space-4); }
  .welcome { padding: var(--space-6) 0; }
  .welcome h2 { font: var(--typography-heading); font-family: var(--font-family-sans); }
  .sugg-grid { grid-template-columns: minmax(0, 1fr); }
  .state-card { padding: var(--space-12) var(--space-4); }
  .composer { padding: 0 var(--space-4) var(--space-4); }
  .chips-row { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); scrollbar-width: none; }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  .hint .k { display: none; }
  .hint:not(:has(.att-err:not([hidden]))) { display: none; }
  .tobottom { display: none; }
  .toast { left: var(--space-4); right: var(--space-4); }
  .model-pop { position: absolute; top: auto; bottom: calc(100% + var(--space-2)); left: 0; right: auto; width: calc(var(--hifi-popover-w) * 0.8); }
}
</style>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var q = new URLSearchParams(location.search);
  var D = JSON.parse(document.getElementById('data').textContent);
  var C = D.chat;
  var $ = function (id) { return document.getElementById(id); };
  var css = getComputedStyle(root);
  var tok = function (name) { return parseFloat(css.getPropertyValue(name)); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var icon = function (name, cls) { return '<svg class="icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; };
  var isMobile = function () { return matchMedia('(max-width: 768px)').matches; };
  var isTablet = function () { return matchMedia('(max-width: 1024px)').matches; };

  /* ---------- 路由参数 ---------- */
  var theme = q.get('theme');
  if (!/^(light|dark)$/.test(theme || '')) { try { theme = localStorage.getItem('acme.theme'); } catch (e) { theme = null; } }
  if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var applyTheme = function (t) {
    theme = t; root.setAttribute('data-theme', t);
    $('themeBtn').setAttribute('aria-label', t === 'dark' ? '切换为亮色' : '切换为暗色');
  };
  applyTheme(theme);
  var state = q.get('state') || 'success';
  if (!/^(success|streaming|error|empty|loading)$/.test(state)) state = 'success';
  var convId = q.get('conversation') || 'c_1';
  if (!C.conversations.some(function (c) { return c.id === convId; })) convId = 'c_1';
  if (state === 'empty') convId = null;
  root.setAttribute('data-sidebar', q.get('sidebar') === 'rail' || (q.get('sidebar') !== 'expanded' && isTablet() && !isMobile()) ? 'rail' : 'expanded');
  $('searchKbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';

  /* ---------- 时间工具（相对快照 meta.asOf） ---------- */
  var asOf = new Date(D.meta.asOf);
  var DAY = 86400000;
  var dayIndex = function (d) { var t = new Date(d.getTime() + 8 * 3600000); return Math.floor(t.getTime() / DAY); }; /* Asia/Shanghai 日序号 */
  var todayIdx = dayIndex(asOf);
  var hm = function (iso) { return iso.slice(11, 16); };
  var md = function (iso) { return iso.slice(5, 10); };
  var dateLabel = function (iso) { var di = dayIndex(new Date(iso)); return di === todayIdx ? '今天' : di === todayIdx - 1 ? '昨天' : md(iso); };
  var listTime = function (c) {
    var di = dayIndex(new Date(c.updatedAt));
    if (di === todayIdx) return hm(c.updatedAt);
    if (di === todayIdx - 1) return '昨天 ' + hm(c.updatedAt);
    if (c.group === 'week') return md(c.updatedAt) + ' ' + hm(c.updatedAt);
    return md(c.updatedAt);
  };
  var daysAgo = function (iso) { return Math.floor((asOf - new Date(iso)) / DAY) + ' 天前'; };
  var dur = function (ms) { return (Math.round(ms / 100) / 10).toFixed(1) + ' 秒'; };

  /* ---------- 侧边栏（与 dashboard 同） ---------- */
  $('nav').innerHTML = D.nav.map(function (g) {
    return '<div class="nav-group"><span class="nav-group-label" id="ng-' + g.group + '">' + esc(g.groupLabel) + '</span><ul aria-labelledby="ng-' + g.group + '">' +
      g.items.map(function (it) {
        var linkAttrs = it.implemented ? ' href="' + esc(it.path) + '"' : ' role="link" aria-disabled="true" tabindex="0" data-path="' + esc(it.path) + '" data-tip="后续轮次提供"';
        var railTip = it.implemented ? it.label : it.label + ' · 后续轮次提供';
        return '<li><a class="nav-item"' + linkAttrs + ' data-tip-rail="' + esc(railTip) + '"' + (it.badge ? ' data-badge="' + it.badge + '"' : '') + '>' + icon(it.icon) +
          '<span class="nav-label">' + esc(it.label) + '</span>' +
          (it.badge ? '<span class="count-badge' + (it.badgeTone === 'warning' ? ' tone-warning' : '') + '" aria-label="' + esc(it.badgeMeaning) + ' ' + it.badge + '">' + it.badge + '</span>' : '') +
          '</a></li>';
      }).join('') + '</ul></div>';
  }).join('');
  document.addEventListener('click', function (e) { if (e.target.closest('[aria-disabled="true"]')) e.preventDefault(); });
  $('collapseBtn').addEventListener('click', function () {
    var rail = root.getAttribute('data-sidebar') !== 'rail';
    root.setAttribute('data-sidebar', rail ? 'rail' : 'expanded');
    this.setAttribute('aria-pressed', String(rail));
    this.setAttribute('aria-label', rail ? '展开侧边栏' : '收起侧边栏');

    if (!rail) this.removeAttribute('data-tip-rail'); else this.setAttribute('data-tip-rail', '展开侧边栏');
  });
  var syncInert = function () {
    $('sidebar').toggleAttribute('inert', isMobile() && root.getAttribute('data-drawer') !== 'open');
    $('convs').toggleAttribute('inert', isMobile() && root.getAttribute('data-convs') !== 'open');
  };
  var setDrawer = function (open) {

  };
  $('chips').innerHTML = suggHtml(false);
  $('suggGrid').innerHTML = suggHtml(true);
  var onSuggest = function (e) {
    var b = e.target.closest('[data-key]'); if (!b) return;
    var key = b.getAttribute('data-key');
    if (SUGG_TARGET[key]) { go(SUGG_TARGET[key]); return; }
    var s = C.suggestions.filter(function (x) { return x.key === key; })[0];
    $('msgInput').value = s.label; syncComposer(); $('msgInput').focus();
  };
  $('chips').addEventListener('click', onSuggest);
  $('suggGrid').addEventListener('click', onSuggest);

  var ta = $('msgInput');
  ta.placeholder = C.composer.placeholder;
  $('hintText').textContent = C.composer.hint;
  var MAX = 2000;
  var syncComposer = function () {
    ta.style.height = 'auto';
    var tcs = getComputedStyle(ta);
    ta.style.height = Math.max(tok('--size-hit'), Math.min(ta.scrollHeight, parseFloat(tcs.lineHeight) * C.composer.maxRows + tok('--space-4'))) + 'px';
    var n = ta.value.length;
    $('sendBtn').disabled = n === 0 || n > MAX || state === 'streaming';
    var c = $('counter'); c.textContent = n + ' / ' + MAX;
    c.classList.toggle('is-visible', n >= MAX * 0.9); c.classList.toggle('is-over', n > MAX);
    if (n > MAX) c.setAttribute('aria-label', '消息不超过 2000 字'); else c.removeAttribute('aria-label');
  };
  ta.addEventListener('input', syncComposer);
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('sendBtn').disabled) $('composer').requestSubmit(); } });
  $('composer').addEventListener('submit', function (e) { e.preventDefault(); if ($('sendBtn').disabled) return; ta.value = ''; syncComposer(); setState('streaming'); });
  $('stopBtn').addEventListener('click', function () { setState('success'); ta.focus(); });
  var renderAttach = function (file) {
    if (!file) { $('attRow').hidden = true; $('attRow').innerHTML = ''; return; }
    $('attRow').hidden = false;
    $('attRow').innerHTML = '<span class="att-chip">' + icon('file-text') + '<span class="att-name">' + esc(file.name) + '</span><span class="att-size num">· ' + esc(file.size) + '</span><button class="iconbtn" type="button" aria-label="移除附件 ' + esc(file.name) + '" data-remove>' + icon('x', 'icon-sm') + '</button></span>';
  };
  $('attRow').addEventListener('click', function (e) { if (e.target.closest('[data-remove]')) { renderAttach(null); $('attachBtn').focus(); } });
  $('attachBtn').addEventListener('click', function () { renderAttach({ name: '缺货SKU-0906.csv', size: '12 KB' }); });

  /* 复制 / 反馈 */
  document.addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var done = function () { cp.setAttribute('aria-pressed', 'true'); cp.setAttribute('aria-label', '已复制'); setTimeout(function () { cp.setAttribute('aria-pressed', 'false'); cp.setAttribute('aria-label', cp.classList.contains('code-copy') ? '复制代码' : '复制回复'); }, tok('--timing-toast-stay')); };
      done();
      if (navigator.clipboard) navigator.clipboard.writeText(cp.getAttribute('data-copy')).catch(function () {});
      return;
    }
    var fb = e.target.closest('.fb');
    if (fb) { var on = fb.getAttribute('aria-pressed') !== 'true'; fb.parentNode.querySelectorAll('.fb').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); fb.setAttribute('aria-pressed', String(on)); }
  });

  /* ---------- Toast ---------- */
  var toastTimer;
  var showToast = function (text, hold) {
    $('toastText').textContent = text; $('toast').hidden = false; clearTimeout(toastTimer);
    if (!hold) toastTimer = setTimeout(function () { $('toast').hidden = true; }, tok('--timing-toast-stay'));
  };
  $('toastClose').addEventListener('click', function () { $('toast').hidden = true; clearTimeout(toastTimer); });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (root.getAttribute('data-dialog') === 'open') { closeDialog(); return; }
    if (menuBtn) { var b = menuBtn; closeConvMenu(); b.focus(); return; }
    if (openPop) { var pb = openPop.btn; closePop(); pb.focus(); return; }
    if (root.getAttribute('data-drawer') === 'open') setDrawer(false);
    if (root.getAttribute('data-convs') === 'open') setConvs(false);
  });
  window.addEventListener('popstate', function () { location.reload(); });

  /* ---------- 初始化 ---------- */
  root.setAttribute('data-state', state);
  if (convId) root.setAttribute('data-conversation', convId); else root.removeAttribute('data-conversation');
  if (convId && byId[convId] && !q.has('keep-unread')) byId[convId].unread = false;
  renderList(''); renderThread(); syncComposer();
  if (q.has('attach')) renderAttach({ name: '缺货SKU-0906.csv', size: '12 KB' });
  if (q.get('toast') === 'urgent') showToast('已把 SO-20260903-0087 标记为加急', q.has('hold'));
  var open = q.get('open');
  if (open === 'notifications') togglePop($('bellBtn'), $('notifPop'), true);
  if (open === 'account') togglePop($('acctBtn'), $('acctPop'), true);
  if (open === 'model') togglePop($('modelBtn'), $('modelPop'), true);
  if (open === 'drawer') setDrawer(true);
  if (open === 'sidebar') setConvs(true, true);
  if (open === 'menu') { var mb = $('convList').querySelector('.citem-more[data-id="' + (convId || 'c_3') + '"]'); if (mb) { if (isMobile()) setConvs(true, true); requestAnimationFrame(function () { openConvMenu(mb); }); } }
  if (open === 'delete') openDialog(convId || 'c_3');
  if ('ResizeObserver' in window) { var ro = new ResizeObserver(stick); ro.observe($('thread')); ro.observe($('log')); }
})();
</script>
</body>
</html>
